
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="EduPulse - The next-generation School Management System. AI-powered insights, real-time analytics, and modern faculty management on Vercel.">
    <meta name="theme-color" content="#4f46e5">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="EduPulse | Modern School Management">
    <meta property="og:description" content="Manage students, faculty, and academic results with AI-powered performance insights.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1523050335391-4bda4ad7bd3d?auto=format&fit=crop&q=80&w=1200">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="EduPulse | Modern School Management">
    <meta property="twitter:description" content="The ultimate AI-driven dashboard for educational institutions.">

    <title>EduPulse Dashboard | Modern School Management</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html {
            scroll-behavior: smooth;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6366f1;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .page-transition {
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    <!-- ES Module Shims for ESM support in all browsers -->
    <script async src="https://esm.sh/es-module-shims@1.10.0/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
        "react": "https://esm.sh/react@^19.2.4",
        "react/": "https://esm.sh/react@^19.2.4/",
        "react-dom": "https://esm.sh/react-dom@^19.2.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
      }
    }
    </script>
</head>
<body class="page-transition">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
    <noscript>
        <div style="padding: 40px; text-align: center; font-family: 'Inter', sans-serif;">
            <h1 style="color: #4f46e5;">JavaScript Required</h1>
            <p>Please enable JavaScript to experience the EduPulse Management System.</p>
        </div>
    </noscript>
</body>
</html>
